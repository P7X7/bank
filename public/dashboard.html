<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم — نظام التحقق من الحوالات</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">B</div>
      <div>
        <strong>BANK</strong>
        <span>التحقق من الحوالات</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-tab="overview">نظرة عامة</button>
      <button class="nav-item" data-tab="transfers">الحوالات</button>
      <button class="nav-item" data-tab="receipts">الإيصالات</button>
      <button class="nav-item" data-tab="staff">الموظفون</button>
      <button class="nav-item" data-tab="settings">الإعدادات</button>
      <button class="nav-item" data-tab="audit">سجل العمليات</button>
    </nav>
    <div class="sidebar-footer">
      <span id="current-user">—</span>
      <button id="logout-btn" class="btn btn-ghost">خروج</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">نظرة عامة</h1>
      <div class="topbar-actions">
        <span class="pill" id="usd-rate-pill">سعر الدولار: —</span>
      </div>
    </header>

    <section class="tab active" id="tab-overview">
      <div class="cards" id="overview-cards"></div>
      <div class="grid-2">
        <div class="panel">
          <h2>أحدث الإيصالات</h2>
          <div class="table-wrap"><table id="recent-receipts"></table></div>
        </div>
        <div class="panel">
          <h2>أحدث الحوالات</h2>
          <div class="table-wrap"><table id="recent-transfers"></table></div>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-transfers">
      <div class="toolbar">
        <input type="search" id="transfer-search" placeholder="بحث بالاسم أو رقم العملية أو المبلغ" />
        <select id="transfer-status">
          <option value="">كل الحالات</option>
          <option value="available">متاحة</option>
          <option value="linked">مرتبطة</option>
          <option value="flagged">معلّمة</option>
        </select>
        <select id="transfer-currency">
          <option value="">كل العملات</option>
          <option value="SAR">ريال سعودي</option>
          <option value="USD">دولار أمريكي</option>
        </select>
        <button class="btn" id="transfer-refresh">تحديث</button>
      </div>
      <div class="panel">
        <div class="table-wrap"><table id="transfers-table"></table></div>
        <div class="pagination" id="transfers-pagination"></div>
      </div>
    </section>

    <section class="tab" id="tab-receipts">
      <div class="toolbar">
        <input type="search" id="receipt-search" placeholder="بحث بالاسم أو رقم العملية أو معرف المستخدم" />
        <select id="receipt-status">
          <option value="">كل الحالات</option>
          <option value="accepted">مقبول</option>
          <option value="rejected">مرفوض</option>
          <option value="review">يحتاج مراجعة</option>
          <option value="error">خطأ</option>
        </select>
        <button class="btn" id="receipt-refresh">تحديث</button>
      </div>
      <div class="panel">
        <div class="table-wrap"><table id="receipts-table"></table></div>
        <div class="pagination" id="receipts-pagination"></div>
      </div>
    </section>

    <section class="tab" id="tab-staff">
      <div class="panel">
        <h2>إضافة موظف</h2>
        <form id="staff-form" class="form-grid">
          <input id="staff-username" placeholder="اسم المستخدم" required />
          <input id="staff-password" type="password" placeholder="كلمة المرور (10 أحرف على الأقل)" required />
          <select id="staff-role">
            <option value="employee">موظف</option>
            <option value="admin">مدير</option>
          </select>
          <input id="staff-discord" placeholder="Discord ID (اختياري)" />
          <button type="submit" class="btn">إضافة</button>
        </form>
        <p class="form-error" id="staff-error" hidden></p>
      </div>
      <div class="panel">
        <h2>الموظفون</h2>
        <div class="table-wrap"><table id="staff-table"></table></div>
      </div>
    </section>

    <section class="tab" id="tab-settings">
      <div class="panel">
        <h2>إعدادات العملات والمطابقة</h2>
        <form id="settings-form" class="form-grid">
          <label>سعر صرف الدولار (ريال)
            <input id="usd_rate" type="number" step="0.01" min="0.01" />
          </label>
          <label>نافذة المطابقة الزمنية (ساعات)
            <input id="match_time_window_hours" type="number" step="1" min="1" />
          </label>
          <label>حد تشابه الأسماء (0 - 1)
            <input id="match_name_min_similarity" type="number" step="0.05" min="0" max="1" />
          </label>
          <label>سماحية فرق المبلغ (ريال)
            <input id="match_amount_tolerance_sar" type="number" step="0.01" min="0" />
          </label>
          <button type="submit" class="btn">حفظ الإعدادات</button>
        </form>
        <p class="form-error" id="settings-error" hidden></p>
      </div>
      <div class="panel">
        <h2>حالة الربط</h2>
        <div class="table-wrap"><table id="integrations-table"></table></div>
        <p class="hint">المفاتيح السرية تُدار عبر متغيرات البيئة فقط ولا تُعرض في اللوحة.</p>
      </div>
    </section>

    <section class="tab" id="tab-audit">
      <div class="panel">
        <div class="table-wrap"><table id="audit-table"></table></div>
        <div class="pagination" id="audit-pagination"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-content">
      <button class="modal-close" id="modal-close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
